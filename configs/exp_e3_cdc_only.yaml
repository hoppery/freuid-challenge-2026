# E3-CDC-ONLY (2026-06-18) — ablation. Identical to exp_e3_capture EXCEPT only the CDC lever
# is on (no FHAG, no focal). Isolates the architectural contribution of Central Difference Conv
# to the capture proxy: if E3-full beats E2-early(0.5466) AND this does too → CDC is the driver;
# if full wins but this ≈ baseline → FHAG/focal drove the gain.
manifest: manifests/freuid_fid_upweighted.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 24
epochs: 3
lr: 0.0001
weight_decay: 0.05
num_workers: 16
val_fraction: 0.1
holdout_by: ""
seed: 42
out_dir: checkpoints/exp_e3_cdc_only
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
heavy_recapture: true
save_every_epoch: true
# --- CDC lever only ---
cdc_theta: 0.7
