# E2-LODO BENIN: does capture-robustness training (FantasyID-physical upweighted + heavy
# print-capture aug) COST unseen-type generalization on the chroma-dependent fold? Train E2 recipe
# but hold out BENIN/DL, so val = unseen BENIN fold. Compare log.csv FREUID to base-896 LODO BENIN
# (no-TENT 0.0780). BENIN fails for the opposite reason to EGYPT (chroma, not appearance) so both
# folds are needed to judge whether heavy capture aug erodes unseen-type detection.
manifest: manifests/freuid_fid_upweighted.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 24
epochs: 4
lr: 0.0001
weight_decay: 0.05
num_workers: 14
val_fraction: 0.15
holdout_by: doc_type
holdout_groups: "BENIN/DL"
seed: 42
out_dir: checkpoints/exp_e2lodo_benin
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
heavy_recapture: true
