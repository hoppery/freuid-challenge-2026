# 1036px = 74 patches x patch14 (DINOv2 reg4). GPU mem ample (896/b8 used only ~4.6GB
# of 98GB); CPU augmentation throughput is the real limit, so batch kept at 8.
manifest: manifests/freuid.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 1036
batch_size: 8
epochs: 8
lr: 0.0001
weight_decay: 0.05
num_workers: 16
val_fraction: 0.15
holdout_by: doc_type
holdout_groups: "EGYPT/DL"
seed: 42
out_dir: checkpoints/exp_d9_res1036_egypt
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
