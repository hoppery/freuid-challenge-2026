# Iteration #9: #7 recipe + FantasyID joint training. Adds 13 doc types (incl.
# Arabic/Persian) and 933 PHYSICAL printed-and-captured bona-fides — the capture-style
# axis that train (99.97% born-digital) lacks and the public test punishes (#6b' gap).
# holdout_groups pins MOZAMBIQUE/DL so results stay comparable to #6b/#7.
manifest: manifests/freuid_plus_fantasyid.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 378
batch_size: 64
epochs: 15
lr: 0.0001
weight_decay: 0.05
num_workers: 16
val_fraction: 0.15
holdout_by: doc_type
holdout_groups: "MOZAMBIQUE/DL"
seed: 42
out_dir: checkpoints/exp_dtc_dinov2_fid
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
