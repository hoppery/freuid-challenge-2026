# GEN-1b (anti-erosion lever, regularized-unfreeze variant). Same E2 recipe + EGYPT holdout as the
# E2-LODO that COLLAPSED (ep0 0.0406 → ep1 0.96), but unfreeze 2 blocks WITH an L2-SP anchor pulling
# them back toward pretrained init (anchor_lambda) — preserves DINOv2 generalization while allowing
# slight adaptation. Bridges GEN-1a (fully frozen = λ→∞) and un-anchored E2-LODO (λ=0). If EGYPT
# stays low across epochs, anti-erosion is confirmed as the fix for the capture-vs-unseen tension.
manifest: manifests/freuid_fid_upweighted.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 24
epochs: 4
lr: 0.0001
weight_decay: 0.05
num_workers: 14
val_fraction: 0.15
holdout_by: doc_type
holdout_groups: "EGYPT/DL"
seed: 42
out_dir: checkpoints/exp_gen1b_anchor_egypt
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
heavy_recapture: true
save_every_epoch: true
anchor_lambda: 1000.0
