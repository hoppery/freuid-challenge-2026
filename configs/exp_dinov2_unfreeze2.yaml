# Fix for the frozen-DINOv2 doc-type-novelty failure (docs root-cause 2026-06-13):
# unfreeze the last 2 ViT blocks + final norm so features can shift from doc-type
# semantics toward forensic texture, and raise resolution 224 -> 378 (multiple of
# patch 14) to restore high-frequency cues lost at 224.
manifest: manifests/freuid.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: rgb
train_aug: heavy
img_size: 378
batch_size: 96
epochs: 15
lr: 0.0001
weight_decay: 0.05
num_workers: 16
val_fraction: 0.15
holdout_by: doc_type
seed: 42
out_dir: checkpoints/exp_dinov2_unfreeze2
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
