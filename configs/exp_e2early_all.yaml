# E2-EARLY (deployment capture+unseen card). LODO test proved the E2 capture recipe acquires ~95%
# of its capture robustness by EPOCH 0 (fantasyid_test AUC 0.756 vs 0.784@ep3) while RETAINING
# appearance-OOD generalization (EGYPT held-out 0.0406 @ep0 → collapses to 0.96 @ep1). So the single
# model that serves BOTH prize axes is the EARLY epoch. Train on ALL 5 types + FantasyID-physical
# (upweighted) + heavy capture aug, snapshot every epoch, pick the epoch maximizing capture proxy
# (fantasyid_test) without over-training away unseen-type. holdout="" (deployment: use all data).
manifest: manifests/freuid_fid_upweighted.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 24
epochs: 3
lr: 0.0001
weight_decay: 0.05
num_workers: 16
val_fraction: 0.1
holdout_by: ""
seed: 42
out_dir: checkpoints/exp_e2early_all
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
heavy_recapture: true
save_every_epoch: true
