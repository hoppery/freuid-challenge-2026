# 896px all-types deployment. Aggressive GPU utilization: batch 48 (~25GB of 98GB;
# 896/b8 used only 4.6GB) + workers 28/32 cores to keep the bigger batch fed (CPU
# augmentation is the real throughput limit). LR stays 1e-4 — do NOT scale LR with
# batch (linear LR scaling previously collapsed training to AUC 0.5). Epochs stay 6:
# high-res converges fast (LODO peaked ep1-2) and fewer epochs avoid seen-type overfit
# that hurts unseen-private generalization.
manifest: manifests/freuid.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 48
epochs: 6
lr: 0.0001
weight_decay: 0.05
num_workers: 28
val_fraction: 0.12
holdout_by: ""
seed: 42
out_dir: checkpoints/exp_deploy896_all
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
