# Ablation: DTC architecture WITHOUT the self-supervised consistency loss
# (dtc_lambda=0 -> TraceMix still applied as augmentation, but the consistency head
# gets no supervision). Isolates "does the aux loss matter, or just the architecture?"
manifest: manifests/freuid_partial.parquet
backbone: convnextv2_tiny.fcmae_ft_in22k_in1k
model_type: dtc
img_size: 384
batch_size: 96
epochs: 10
lr: 0.0003
weight_decay: 0.05
num_workers: 16
val_fraction: 0.15
holdout_by: doc_type
seed: 42
out_dir: checkpoints/exp_dtc_noaux_partial
amp: true
pretrained: true
dtc_lambda: 0.0
tracemix_p: 0.5
