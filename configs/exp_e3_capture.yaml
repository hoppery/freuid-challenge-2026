# E3-FULL (2026-06-18) — CAPTURE-axis card upgrade. Base = E2-early recipe (ViT-B DTC +
# FantasyID-physical upweighted + heavy recapture aug @896, save every epoch). ADDS three
# capture/op-point levers that target print/screen-recapture texture, NOT appearance, so they
# avoid the EGYPT↔BENIN antagonism that sank self-blend / appearance-inv / extgen:
#   (1) FHAG  — frequency-band amplitude aug → trace branch invariant to born-digital↔capture
#               band-energy shift
#   (2) focal — focal BCE (γ=2) on the fraud head → sharpens hard genuine/attack tail (APCER@1%)
#   (3) CDC   — Central Difference Conv (θ=0.7) in the trace branch → recapture gradient texture
# Objective: minimize fantasyid_test FREUID (capture proxy; E2-early ep0 = 0.5466). Pick best epoch.
manifest: manifests/freuid_fid_upweighted.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 24
epochs: 3
lr: 0.0001
weight_decay: 0.05
num_workers: 16
val_fraction: 0.1
holdout_by: ""
seed: 42
out_dir: checkpoints/exp_e3_capture
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
heavy_recapture: true
save_every_epoch: true
# --- E3 capture levers ---
fhag: true
focal_gamma: 2.0
focal_alpha: 0.5
cdc_theta: 0.7
