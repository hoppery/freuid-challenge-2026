# GEN-3 (CMA chromaticity stream — user-chosen lever). Adds a recapture-ROBUST chromaticity stream
# (intensity-normalized, palette-removed, NO high-pass) to the validated unfreeze-2 base recipe.
# Targets BENIN=chroma (our weakest unseen fold). Compare BENIN-LODO to base-LODO BENIN 0.0780
# (same FREUID-only/unfreeze-2 recipe WITHOUT chroma). If CMA pushes BENIN below 0.078 → clean win.
manifest: manifests/freuid.parquet
backbone: vit_base_patch14_reg4_dinov2.lvd142m
model_type: dtc
img_size: 896
batch_size: 16
epochs: 5
lr: 0.0001
weight_decay: 0.05
num_workers: 14
val_fraction: 0.15
holdout_by: doc_type
holdout_groups: "BENIN/DL"
seed: 42
out_dir: checkpoints/exp_gen3_cma_benin
amp: true
pretrained: true
freeze_backbone: true
unfreeze_blocks: 2
dtc_lambda: 0.5
tracemix_p: 0.5
use_chroma: true
cma_chroma: true
save_every_epoch: true
