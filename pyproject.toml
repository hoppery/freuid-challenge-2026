[project]
name = "freuid"
version = "0.1.0"
description = "FREUID Challenge 2026 — ID document fraud detection"
requires-python = ">=3.11"
dependencies = [
  "timm>=1.0.0",
  "albumentations>=1.4.0",
  "opencv-python-headless>=4.9.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.4.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
